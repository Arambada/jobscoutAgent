version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: job-scout-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobscout
      POSTGRES_PASSWORD: jobscout
      POSTGRES_DB: jobscout
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscout"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-scout-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://jobscout:jobscout@postgres:5432/jobscout
    ports:
      # Localhost only: the app has no login
      - "127.0.0.1:3000:3000"
    volumes:
      # Persist uploaded CVs
      - ./uploads:/app/uploads

volumes:
  pgdata:
